services:
  postgres:
    image: postgres:16-alpine
    container_name: weldrr-postgres
    environment:
      POSTGRES_USER: weldrr
      POSTGRES_PASSWORD: weldrr
      POSTGRES_DB: weldrr
    ports:
      - '5432:5432'
    volumes:
      - weldrr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weldrr -d weldrr']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weldrr_pgdata:
